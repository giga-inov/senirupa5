        // Fisher-Yates shuffle helper to randomize options so correct answer isn't always A
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function prepareShuffledQuiz() {
            gameState.shuffledQuizData = quizQuestions.map(q => {
                const shuffledOpts = shuffleArray(q.options);
                return {
                    ...q,
                    options: shuffledOpts
                };
            });
        }

        function navigateTo(screenId) {
            // Unsubscribe teacher realtime listener if leaving dashboard
            if (gameState.currentScreen === 'teacher-dashboard' && screenId !== 'teacher-dashboard') {
                if (unsubscribeTeacher) {
                    unsubscribeTeacher();
                    unsubscribeTeacher = null;
                }
            }

            gameState.currentScreen = screenId;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateStatusBar() {
            const statusBar = document.getElementById('user-status-bar');
            const navUsername = document.getElementById('nav-username');
            const navScore = document.getElementById('nav-score');
            const navAvatar = document.getElementById('nav-avatar');
            const navLives = document.getElementById('nav-lives');

            if (gameState.playerName && gameState.currentScreen !== 'teacher-dashboard') {
                statusBar.classList.remove('hidden');
                statusBar.classList.add('flex');
                navUsername.textContent = gameState.playerName;
                navScore.textContent = `${gameState.score} Poin`;
                navAvatar.textContent = gameState.playerName.charAt(0).toUpperCase();
                
                let hearts = '';
                for(let i=0; i<3; i++) {
                    hearts += i < gameState.lives ? '❤️' : '🖤';
                }
                navLives.textContent = hearts;
            } else {
                statusBar.classList.add('hidden');
                statusBar.classList.remove('flex');
            }
        }

        function render() {
            updateStatusBar();
            const mainView = document.getElementById('main-view');
            mainView.innerHTML = '';

            switch (gameState.currentScreen) {
                case 'welcome':
                    mainView.innerHTML = renderWelcomeScreen();
                    break;
                case 'name-input':
                    mainView.innerHTML = renderNameInputScreen();
                    break;
                case 'map':
                    mainView.innerHTML = renderMapScreen();
                    break;
                case 'material-hub':
                    mainView.innerHTML = renderMaterialHubScreen();
                    break;
                case 'chapter-1':
                    mainView.innerHTML = renderChapter1Screen();
                    break;
                case 'chapter-2':
                    mainView.innerHTML = renderChapter2Screen();
                    break;
                case 'chapter-3':
                    mainView.innerHTML = renderChapter3Screen();
                    break;
                case 'quiz':
                    mainView.innerHTML = renderQuizScreen();
                    break;
                case 'minigame':
                    mainView.innerHTML = renderMiniGameScreen();
                    setTimeout(initMiniGameCanvas, 100);
                    break;
                case 'result':
                    mainView.innerHTML = renderResultScreen();
                    break;
                case 'certificate':
                    mainView.innerHTML = renderCertificateScreen();
                    break;
                case 'teacher-dashboard':
                    mainView.innerHTML = renderTeacherDashboardScreen();
                    initTeacherRealtimeListener();
                    break;
                default:
                    mainView.innerHTML = renderWelcomeScreen();
            }
        }

            const input = document.getElementById('player-name-input');

            if (!name) {
                showAlert("Perhatian", "Mohon masukkan nama kamu terlebih dahulu!", "⚠️");
                return;

                            </button>

        let gameInterval = null;
        let gameScore = 0;
        let bucketX = 150;
        let items = [];
        let isGameRunning = false;

        function initMiniGameCanvas() {
            const canvas = document.getElementById('minigame-canvas');
            if(!canvas) return;
            canvas.width = 400;
            canvas.height = 300;
            bucketX = canvas.width / 2 - 35;
        }

        function startMiniGamePlay() {
            const overlay = document.getElementById('game-overlay');
            if(overlay) overlay.classList.add('hidden');
            gameScore = 0;
            items = [];
            isGameRunning = true;

            const canvas = document.getElementById('minigame-canvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');

            // Listeners for bucket movement
            window.onkeydown = (e) => {
                if(!isGameRunning) return;
                if(e.key === 'ArrowLeft') bucketX = Math.max(0, bucketX - 25);
                if(e.key === 'ArrowRight') bucketX = Math.min(canvas.width - 70, bucketX + 25);
            };

            canvas.ontouchmove = (e) => {
                if(!isGameRunning) return;
                const rect = canvas.getBoundingClientRect();
                const touchX = e.touches[0].clientX - rect.left;
                bucketX = Math.max(0, Math.min(canvas.width - 70, touchX - 35));
            };

            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                if(!isGameRunning) return;

                // Spawn item
                if(Math.random() < 0.05) {
                    items.push({
                        x: Math.random() * (canvas.width - 30),
                        y: -30,
                        speed: 2 + Math.random() * 2,
                        type: Math.random() < 0.25 ? 'black' : 'color',
                        emoji: Math.random() < 0.25 ? '🖤' : ['🖌️','🎨','🔴','🔵','🟡'][Math.floor(Math.random()*5)]
                    });
                }

                // Update items
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw bucket
                ctx.fillStyle = '#6366f1';
                ctx.roundRect ? ctx.roundRect(bucketX, canvas.height - 35, 70, 25, 8) : ctx.fillRect(bucketX, canvas.height - 35, 70, 25);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px sans-serif';
                ctx.fillText("Wadah Cat", bucketX + 5, canvas.height - 18);

                // Draw & update items
                for(let i = items.length - 1; i >= 0; i--) {
                    let it = items[i];
                    it.y += it.speed;
                    ctx.font = '24px sans-serif';
                    ctx.fillText(it.emoji, it.x, it.y);

                    // Check collision with bucket
                    if(it.y >= canvas.height - 45 && it.y <= canvas.height - 15 && it.x >= bucketX - 10 && it.x <= bucketX + 65) {
                        if(it.type === 'black') {
                            gameScore = Math.max(0, gameScore - 5);
                        } else {
                            gameScore += 10;
                        }
                        items.splice(i, 1);
                        continue;
                    }

                    // Remove out of bounds
                    if(it.y > canvas.height) {
                        items.splice(i, 1);
                    }
                }

                // Draw Score
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(`Skor Game: ${gameScore}`, 15, 25);

            }, 1000 / 60);
        }

        function handleAnswer(optionKey) {
            if (gameState.userAnswers[gameState.currentQuestionIndex] !== undefined) return;

            gameState.userAnswers[gameState.currentQuestionIndex] = optionKey;
            const q = gameState.shuffledQuizData[gameState.currentQuestionIndex];

            if (optionKey === q.correct) {
                gameState.score += 20;
                characterGuide.speak(`Benar, ${gameState.playerName}! Hebat sekali!`);
            } else {
                gameState.lives -= 1;
                characterGuide.speak(`Belum tepat, ${gameState.playerName}. Nyawamu berkurang satu.`);
                if (gameState.lives <= 0) {
                    syncStudentProgressToFirebase();
                    setTimeout(() => {
                        showAlert("Game Over", "Nyawamu telah habis! Jangan menyerah, ayo belajar lagi.", "💀");
                        navigateTo('result');

                    return;

function initTeacherRealtimeListener() {
    // 1. Ambil elemen tabel
    const tbody = document.getElementById('student-table-body');
    
    // 2. Cek apakah Firestore sudah siap dari window scope
    if (!window.firebaseInstances || !window.firebaseInstances.db) {
        if (tbody) {
            tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-rose-500 font-bold">Firebase belum terhubung (Mode Offline).</td></tr>';
        }
        return;
    }

    const db = window.firebaseInstances.db;
    const { collection, onSnapshot, query, orderBy } = window.firebaseModules;

    try {
        // 3. Gunakan path koleksi flat 'progres_siswa' agar terhubung langsung ke game siswa
        const studentsColRef = collection(db, 'progres_siswa');
        const q = query(studentsColRef, orderBy('timestamp', 'desc'));

        // 4. Jalankan pendengar realtime realtime (onSnapshot)
        unsubscribeTeacher = onSnapshot(q, (snapshot) => {
            if (!tbody) return;

            if (snapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-400 font-medium">Belum ada siswa yang masuk ke kuis.</td></tr>';
                return;
            }

            let html = '';
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                
                // Kalkulasi visual nyawa hati (❤️)
                const currentLives = typeof data.lives !== 'undefined' ? data.lives : 3;
                const livesStr = '❤️'.repeat(Math.max(0, currentLives)) + '🖤'.repeat(Math.max(0, 3 - currentLives));
                
                // Mengambil huruf pertama untuk avatar siswa
                const initial = data.name ? data.name.charAt(0).toUpperCase() : 'S';

                html += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-4 font-bold text-slate-800 flex items-center space-x-2">
                            <span class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-extrabold">${initial}</span>
                            <span>${data.name || 'Tanpa Nama'}</span>
                        </td>
                        <td class="p-4">
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${data.status === 'Selesai Kuis' ? 'bg-emerald-100 text-emerald-800' : 'bg-indigo-100 text-indigo-800'}">
                                ${data.status || 'Mengerjakan'}
                            </span>
                        </td>
                        <td class="p-4 font-semibold text-slate-700">Soal ke-${(data.currentQuestion || 0) + 1} dari ${data.totalQuestions || 50}</td>
                        <td class="p-4 text-rose-600 tracking-wider">${livesStr}</td>
                        <td class="p-4 text-right font-extrabold text-indigo-700">${data.score || 0} Poin</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
            
            // Perbarui UI indikator koneksi di panel atas menjadi Live Connected jika ada elemennya
            const connectionBadge = document.querySelector('.bg-indigo-50 span');
            if (connectionBadge && connectionBadge.textContent.includes('Offline')) {
                connectionBadge.className = 'px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800';
                connectionBadge.innerHTML = '● Live Connected';
            }
        }, (error) => {
            console.error("Firestore snapshot error:", error);
        });

    } catch (e) {
        console.error("Error setting up teacher listener:", e);
    }
}
