        function navigateTo(screenId) {
            gameState.currentScreen = screenId;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateStatusBar() {
            const statusBar = document.getElementById('user-status-bar');
            const navUsername = document.getElementById('nav-username');
            const navScore = document.getElementById('nav-score');
            const navAvatar = document.getElementById('nav-avatar');

            if (gameState.playerName) {
                statusBar.classList.remove('hidden');
                statusBar.classList.add('flex');
                navUsername.textContent = gameState.playerName;
                navScore.textContent = `${gameState.score} Poin`;
                navAvatar.textContent = gameState.playerName.charAt(0).toUpperCase();
            } else {
                statusBar.classList.add('hidden');
                statusBar.classList.remove('flex');
            }
        }

        function render() {
            updateStatusBar();
            const mainView = document.getElementById('main-view');
            mainView.innerHTML = '';

            switch (gameState.currentScreen) {
                case 'welcome':
                    mainView.innerHTML = renderWelcomeScreen();
                    break;
                case 'name-input':
                    mainView.innerHTML = renderNameInputScreen();
                    break;
                case 'map':
                    mainView.innerHTML = renderMapScreen();
                    break;
                case 'material-hub':
                    mainView.innerHTML = renderMaterialHubScreen();
                    break;
                case 'chapter-1':
                    mainView.innerHTML = renderChapter1Screen();
                    break;
                case 'chapter-2':
                    mainView.innerHTML = renderChapter2Screen();
                    break;
                case 'chapter-3':
                    mainView.innerHTML = renderChapter3Screen();
                    break;
                case 'quiz':
                    mainView.innerHTML = renderQuizScreen();
                    break;
                case 'result':
                    mainView.innerHTML = renderResultScreen();
                    break;
                case 'certificate':
                    mainView.innerHTML = renderCertificateScreen();
                    break;
                default:
                    mainView.innerHTML = renderWelcomeScreen();
            }
        }

            if (gameState.userAnswers[gameState.currentQuestionIndex] !== undefined) return;

                </div>

            let correctCount = 0;

                    wrongCount++;

                    <h3 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-1">PETUALANGAN SELESAI!</h3>
                    <p class="text-slate-600 text-sm mb-4">Selamat, ${gameState.playerName}! Kamu telah menaklukkan seluruh tantangan seni.</p>

                    <div class="px-5 py-2 rounded-2xl border-2 font-extrabold text-sm sm:text-base mb-6 ${badgeBg}">
                        ${categoryBadge}
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full max-w-lg mb-6">
                        <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl">
                            <div class="text-xs text-indigo-600 font-bold uppercase">Total Skor</div>
                            <div class="text-2xl font-extrabold text-indigo-800 mt-1">${gameState.score} / 1000</div>
                        </div>
                        <div class="bg-emerald-50 border border-emerald-100 p-4 rounded-2xl">
                            <div class="text-xs text-emerald-600 font-bold uppercase">Jawaban Benar</div>
                            <div class="text-2xl font-extrabold text-emerald-800 mt-1">${correctCount} / 50</div>
                        </div>
                        <div class="bg-rose-50 border border-rose-100 p-4 rounded-2xl">
                            <div class="text-xs text-rose-600 font-bold uppercase">Belum Tepat</div>
                            <div class="text-2xl font-extrabold text-rose-800 mt-1">${wrongCount} / 50</div>
                        </div>
                    </div>

                    <div class="flex flex-wrap justify-center gap-3 w-full max-w-md">
                        <button onclick="navigateTo('certificate')" class="flex-grow py-4 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-extrabold rounded-2xl shadow-lg flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-award"></i>
                            <span>🏆 LIHAT SERTIFIKAT</span>
                        </button>
                        <button onclick="resetQuiz()" class="px-6 py-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-extrabold rounded-2xl shadow-sm flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-rotate-right"></i>
                            <span>🔄 ULANGI KUIS</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function resetQuiz() {
            gameState.score = 0;
            gameState.currentQuestionIndex = 0;
            gameState.userAnswers = {};
            startQuiz();
        }

        function renderCertificateScreen() {
            const today = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
            let correctCount = 0;
            quizQuestions.forEach((q, idx) => {
                if (gameState.userAnswers[idx] === q.correct) correctCount++;
            });

            return `
                <div class="flex-grow flex flex-col p-4 sm:p-6 bg-white/70 backdrop-blur-md rounded-3xl art-card-shadow border border-white my-2">
                    <!-- Certificate Header Action -->
                    <div class="flex items-center justify-between mb-4 border-b pb-3 print:hidden">
                        <button onclick="navigateTo('result')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Kembali
                        </button>
                        <button onclick="window.print()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs flex items-center space-x-2 shadow">
                            <i class="fa-solid fa-print"></i>
                            <span>Cetak Sertifikat</span>
                        </button>
                    </div>

                    <!-- Digital Certificate Canvas -->
                    <div class="bg-gradient-to-br from-amber-50 via-white to-indigo-50 border-8 border-double border-indigo-600 p-6 sm:p-10 rounded-3xl text-center shadow-2xl relative overflow-hidden my-auto">
                        <div class="absolute top-4 left-4 text-3xl opacity-20">🎨</div>
                        <div class="absolute bottom-4 right-4 text-3xl opacity-20">🖌️</div>

                        <div class="text-indigo-600 font-bold text-xs sm:text-sm uppercase tracking-widest mb-1">KEMENTERIAN PENDIDIKAN DAN KEBUDAYAAN</div>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-wide mb-2 font-serif">SERTIFIKAT PENGHARGAAN</h2>
                        <p class="text-xs text-slate-500 italic mb-6">Diberikan secara resmi kepada Seniman Muda berprestasi</p>

                        <div class="text-sm text-slate-600 mb-2">Atas keberhasilannya menyelesaikan dengan gemilang:</div>
                        <div class="text-xl sm:text-3xl font-extrabold text-indigo-700 underline decoration-indigo-300 decoration-4 underline-offset-8 mb-4 uppercase">
                            ${gameState.playerName || 'Seniman Muda'}
                        </div>

                        <div class="text-xs sm:text-sm text-slate-700 max-w-lg mx-auto mb-6 leading-relaxed font-medium">
                            Dalam game edukasi interaktif <strong>"PETUALANGAN SENI RUPA KELAS 5 SD/MI"</strong> dengan materi Unsur & Prinsip Seni Rupa, Ritme & Pola, serta Proporsi & Komposisi.
                        </div>

                        <div class="flex justify-center items-center gap-6 mb-8">
                            <div class="bg-white/80 border border-indigo-200 px-6 py-3 rounded-2xl shadow-sm">
                                <div class="text-xs text-slate-500 font-bold uppercase">Total Skor</div>
                                <div class="text-lg font-extrabold text-indigo-600">${gameState.score} / 1000</div>
                            </div>
                            <div class="bg-white/80 border border-indigo-200 px-6 py-3 rounded-2xl shadow-sm">
                                <div class="text-xs text-slate-500 font-bold uppercase">Jawaban Benar</div>
                                <div class="text-lg font-extrabold text-emerald-600">${correctCount} dari 50 Soal</div>
                            </div>
                        </div>

                        <div class="flex justify-between items-end border-t border-indigo-200 pt-6 px-4">
                            <div class="text-left">
                                <div class="text-xs text-slate-500 font-semibold">Tanggal Penerbitan</div>
                                <div class="text-xs font-bold text-slate-800">${today}</div>
                            </div>
                            <div class="text-center">
                                <div class="w-16 h-16 mx-auto bg-indigo-600 text-white rounded-full flex items-center justify-center text-2xl shadow mb-1">🏆</div>
                                <div class="text-[10px] font-bold text-indigo-900 uppercase">Terverifikasi Resmi</div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs text-slate-500 font-semibold">Pengembang Game</div>
                                <div class="text-xs font-bold text-indigo-700">Giga Inovation</div>
                                <div class="text-[10px] text-slate-400">081329200985</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Initialize App on Window Load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
